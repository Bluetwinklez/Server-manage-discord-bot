permissions:
  contents: read
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci

      # Her .js dosyasının require-time hatasız yüklendiğini doğrular — deploy-commands.js'in
      # kendi yükleyicisiyle aynı denetim, bir komut dosyasındaki syntax hatasını PR aşamasında yakalar.
      - name: Syntax check (tüm .js dosyaları)
        run: |
          find src -name "*.js" -print0 | xargs -0 -n1 node --check
          node --check index.js
          node --check deploy-commands.js
          node --check setup.js

      - name: Testler
        run: npm test
