permissions:
  contents: read
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - run: npm ci

      # Her .js dosyasının require-time hatasız yüklendiğini doğrular — deploy-commands.js'in
      # kendi yükleyicisiyle aynı denetim, bir komut dosyasındaki syntax hatasını PR aşamasında yakalar.
      - name: Syntax check (tüm .js dosyaları)
        run: |
          find src -name "*.js" -print0 | xargs -0 -n1 node --check
          node --check index.js
          node --check deploy-commands.js
          node --check setup.js

      - name: Testler
        run: npm test
